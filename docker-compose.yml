services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: talky
      POSTGRES_PASSWORD: talky_dev
      POSTGRES_DB: talky
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U talky"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
